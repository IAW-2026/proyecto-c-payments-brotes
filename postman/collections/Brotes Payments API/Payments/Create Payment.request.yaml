$kind: http-request
name: Create Payment
method: POST
url: "{{baseUrl}}/api/payments"
auth:
  type: inherit
  credentials:
    id: 8248c099-d20b-4293-be5c-6d32ffa39c24
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "order_id": "{{order_id}}",
      "buyer_id": "{{buyer_id}}",
      "seller_id": "{{seller_id}}",
      "amount": 1500,
      "currency": "ARS",
      "buyer_email": "test_user@test.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Response has payment_id", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("payment_id");
        pm.collectionVariables.set("payment_id", json.payment_id);
      });
      pm.test("Payment status is approved", function () {
        const json = pm.response.json();
        pm.expect(json.status).to.eql("approved");
      });
      pm.test("Amount matches", function () {
        const json = pm.response.json();
        pm.expect(json.amount.value).to.eql(1500);
      });
    language: text/javascript
