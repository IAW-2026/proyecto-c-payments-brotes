$kind: http-request
method: GET
url: '{{baseUrl}}/api/payouts/{{seller_id}}'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has seller_id", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("seller_id");
      });
      pm.test("Response has payouts array", function () {
        const json = pm.response.json();
        pm.expect(json.payouts).to.be.an("array");
      });
      pm.test("Response has total_paid", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("total_paid");
      });
